# HYEONGI configuration — /etc/hyeongi/hyeongi.yaml
#
# One file drives every service. After editing:
#   sudo systemctl restart hyeongid
#
# SAFETY: enforcement is OFF until you set `enforce: true`. While it is false,
# every detector runs in dry-run: it logs what it WOULD block (see
# `hyeongi logs`) and blocks nothing.

enforce: false            # true = actually add attacker IPs to the kernel blocklist
backend: nft              # enforcement backend (nft | xdp) — xdp: packaging/install-xdp.sh
block_timeout: 1h         # how long a block lasts before it expires on its own
block_private: false      # never block RFC1918/LAN addresses unless true
skip: []                  # IPs that must never be blocked, e.g. [192.168.0.1]  (your gateway)
                          # also devices that connect to you on purpose (VNC from a tablet, etc.)
                          # alerts whose source is this host itself are always dropped
protect_local: true       # never block this host's current DNS servers, gateway, own addresses
# per-network enforcement: list your home gateway MAC (hyeongi ctl trust-here);
# then every other network is observe-only. Empty = off (enforce everywhere).
# names: gateway MAC -> name written in the flow logs' `net` column
# (hyeongi name-here home); unnamed networks get a salted gw-xxxxxxxx tag.
networks: {trusted_gateways: [], names: {}}

ids:                      # signature detector: Snort 3 alert_json or Suricata eve.json
  enabled: true
  alert_file: /var/log/hyeongi/snort/alert_json.txt   # Suricata: /var/log/suricata/eve.json
  # alerts that never lead to a block (the triage still sees them)
  ignore_gids: [116, 119, 128, 129, 137]   # Snort protocol-anomaly inspectors
  # single rules "gid:sid": ICMP replies and pings, port_scan sweeps (see config.py)
  ignore_rules: ["1:396", "1:399", "1:402", "1:408", "1:449", "1:451", "1:366", "1:384", "1:480", "1:29456", "122:3", "122:7", "122:19", "122:23"]
  # shellcode rules match bytes; on TLS ports those bytes are ciphertext, so they are ignored there only
  encrypted_ports: [443, 465, 563, 636, 853, 989, 990, 992, 993, 994, 995, 5061, 8443]
  payload_rule_prefixes: ["INDICATOR-SHELLCODE", "SHELLCODE"]
  # elsewhere those rules are review-only: logged, shown to the triage, never a block by
  # themselves (plain-HTTP downloads match them by chance). true = old behaviour
  payload_block: false
  # never block on their own, shown and reviewed: Snort UDP port scans. On a client they
  # come from its own UDP (P2P peers answering ICMP port unreachable, QUIC on 443)
  # and 1:1201, an HTTP 403 answer from a web server this host asked
  review_rules: ["122:17", "122:18", "122:20", "122:21", "122:22", "122:24", "1:1201", "1:254"]
  keep_rotated: 3          # rotated alert files to keep (Snort renames one at 100 MB)

ml:                       # flow classifier: nfstream + RandomForest
  enabled: true
  iface: eth0
  model: /var/lib/hyeongi/model.joblib   # train with: hyeongi train ... --out <this>
  threshold: 0.9          # pick it with: hyeongi eval ... --target-fpr 0.01
  idle: 15
  active: 120

xdp:                      # XDP enforcement (used when backend: xdp)
  iface: eth0
  mode: generic            # generic works on any NIC (Wi-Fi too); native needs driver support

capture:                  # flow features for ML training data, as CSV (no payload stored)
  enabled: auto           # auto = on when nfstream is installed
  dir: /var/lib/hyeongi/flows
  rows_per_file: 50000    # ~20 MB per file
  keep: 100               # disk budget in full files (~2 GB, several million flows): the
                          # oldest logs are deleted only when all of them exceed it

triage:                   # "Inspection": read-only LLM review of flagged IPs (local Ollama); never blocks or unblocks
  enabled: true
  alert_file: /var/log/hyeongi/snort/alert_json.txt   # same file as ids.alert_file
  last: 500
  summary_minutes: 60      # per-IP evidence for the LLM covers this many minutes
  settle: 20               # wait until detectors stop reporting (seconds, 0 = off)
  model: qwen2.5:7b
  host: http://127.0.0.1:11434
  timeout: 300            # seconds: queue behind another Ollama client + cold load + answer
  num_ctx: 4096           # context sent to Ollama; the report warns when the prompt fills it
  keep_alive: 5m          # how long Ollama keeps the model loaded after a review
  retries: 1              # after a refused connection or a 5xx, 10 s apart
  fallback_model: qwen2.5:3b   # used if the main model fails or runs mostly on the CPU (empty = off)
  lang: Korean
  out: /var/lib/hyeongi/triage/report.txt

daemon:                   # hyeongid timers
  expiry_interval: 60     # seconds between expiry checks
  triage_interval: 3600   # seconds between LLM reports
